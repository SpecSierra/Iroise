<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 544" width="544" height="544">
  <!-- Iroise launcher icon: calm red swells. The outline is the Sailfish launcher shape: one large rounded corner,
       the others square. -->
  <defs>
    <clipPath id="shape">
      <path d="M0,544 L0,312 Q0,0 312,0 L544,0 L544,544 Z"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FFE0CC"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2463A"/>
      <stop offset="1" stop-color="#B9121F"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="544" height="544" fill="url(#sky)"/>
    <!-- a swell far out -->
    <path d="M0,278 C100,242 200,246 292,272 S462,304 544,266 L544,544 L0,544 Z" fill="#FF9C8A"/>
    <!-- the main swell -->
    <path d="M0,352 C96,300 206,298 302,334 S470,372 544,328 L544,544 L0,544 Z" fill="url(#wave)"/>
    <!-- water in front -->
    <path d="M0,428 C104,396 206,400 300,424 S462,452 544,418 L544,544 L0,544 Z" fill="#8E0C18"/>
  </g>
</svg>
