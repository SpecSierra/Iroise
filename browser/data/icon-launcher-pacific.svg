<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 544" width="544" height="544">
  <!-- Pacific launcher icon: a red wave. The outline is the Sailfish launcher shape the Atlantic icon used. -->
  <defs>
    <clipPath id="shape">
      <path d="M0,544 L0,230 Q0,0 230,0 L496,0 Q544,0 544,48 L544,496 Q544,544 496,544 Z"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FFE0CC"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2463A"/>
      <stop offset="1" stop-color="#B9121F"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="544" height="544" fill="url(#sky)"/>
    <!-- a swell behind -->
    <path d="M0,372 C90,318 170,318 262,366 S440,420 544,352 L544,544 L0,544 Z" fill="#FF9C8A"/>
    <!-- the wave, breaking to the right -->
    <path d="M0,544 L0,418 C84,410 150,346 196,262 C246,170 344,124 420,166 C484,202 490,290 436,320
             C398,340 356,318 356,286 C356,262 380,248 402,260 C366,222 300,246 288,312
             C276,384 366,440 544,424 L544,544 Z" fill="url(#wave)"/>
    <!-- water in front -->
    <path d="M0,470 C96,430 190,440 284,476 S460,510 544,468 L544,544 L0,544 Z" fill="#8E0C18"/>
    <!-- spray -->
    <circle cx="470" cy="138" r="13" fill="#F2463A"/>
    <circle cx="502" cy="186" r="8" fill="#F2463A"/>
    <circle cx="440" cy="98" r="7" fill="#FF9C8A"/>
  </g>
</svg>
